<style>
:root{--bg:#f2f4ef;--ink:#12211b;--mut:#5b6b63;--card:#fff;--line:#d9dfd7;--g:#0e6b4d;--y:#f5c400;--win:#e3f3ea;--box:box-sizing;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1713;--ink:#eaf1ec;--mut:#9fb0a6;--card:#17221c;--line:#2a3a31;--g:#3fbf8f;--win:#17352a}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Telugu","Noto Sans Devanagari",system-ui,sans-serif;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:22px}
.logo i{font-style:normal;background:var(--y);color:#12211b;padding:0 6px;border-radius:4px}
.lang{display:flex;flex-wrap:wrap;border:2px solid var(--ink);border-radius:18px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--ink);padding:6px 14px;font:inherit;font-weight:600;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--y);outline-offset:2px}
h1{font-family:"Bricolage Grotesque","Noto Sans Telugu","Noto Sans Devanagari",sans-serif;font-size:clamp(28px,6vw,46px);line-height:1.15;margin:28px 0 8px;font-weight:800}
.sub{color:var(--mut);margin:0 0 20px}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pick label{font-size:13px;color:var(--mut);display:block}
select,input{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.tw{overflow-x:auto;margin-top:18px;border:1.5px solid var(--line);border-radius:10px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{font-family:"Bricolage Grotesque",sans-serif}
td:first-child{color:var(--mut);width:28%}
td.win{background:var(--win);font-weight:700}
tr:last-child td{border-bottom:0}
.sum{margin-top:16px;padding:14px 16px;border-left:6px solid var(--y);background:var(--card);border-radius:0 8px 8px 0}
.lead{margin-top:28px;padding:18px;background:var(--g);color:#fff;border-radius:12px}
.lead h2{margin:0 0 4px;font-size:22px}
.lead p{margin:0 0 12px;opacity:.92}
.lead form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lead .full{grid-column:1/-1}
.lead button{grid-column:1/-1;background:var(--y);color:#12211b;border:0;padding:12px;border-radius:8px;font:inherit;font-weight:800;cursor:pointer}
.ok{display:none;margin-top:10px;background:#fff;color:#12211b;padding:10px;border-radius:8px;font-weight:600}
.ok a{color:#0e6b4d;font-weight:800}
.note{font-size:12px;color:var(--mut);margin:18px 0}
@media(max-width:560px){.pick{grid-template-columns:1fr}.lead form{grid-template-columns:1fr}}
</style>
